name: Build plugin release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build installable plugin ZIP
        run: |
          mkdir -p dist/technorapper-ai-wire
          cp technorapper-ai-wire.php README.md dist/technorapper-ai-wire/
          cd dist
          zip -r technorapper-ai-wire.zip technorapper-ai-wire
          sha256sum technorapper-ai-wire.zip > technorapper-ai-wire.zip.sha256

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: technorapper-ai-wire-${{ github.ref_name }}
          path: |
            dist/technorapper-ai-wire.zip
            dist/technorapper-ai-wire.zip.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release asset for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/technorapper-ai-wire.zip
            dist/technorapper-ai-wire.zip.sha256
